name: ios-unsigned-ipa

on:
  workflow_dispatch:
  push:
    paths:
      - "ios/**"
      - ".github/workflows/ios-unsigned-ipa.yml"

jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 生成工程
        run: xcodegen generate

      - name: 编译（模拟器）
        run: |
          xcodebuild -project YunmeiLock.xcodeproj \
            -scheme YunmeiLock \
            -destination 'generic/platform=iOS Simulator' \
            build

      - name: 运行单元测试
        run: bash ./scripts/build-macos.sh test

      - name: 编译（不签名）
        run: |
          xcodebuild -project YunmeiLock.xcodeproj \
            -scheme YunmeiLock \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: 打包未签名 ipa
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          echo "app=$APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qr YunmeiLock-unsigned.ipa Payload
          ls -lh YunmeiLock-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: YunmeiLock-unsigned-ipa
          path: ios/YunmeiLock-unsigned.ipa
          retention-days: 14
